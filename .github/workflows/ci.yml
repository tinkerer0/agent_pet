name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Universal app
        run: ARCHS="arm64 x86_64" bash scripts/build.sh
      - name: Test monitor and bundled animations
        run: bash scripts/test.sh dist/AgentPet.app/Contents/Resources
